name: Release Plugin

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送 v* 标签（如 v1.0.5）

jobs:
  build:
    name: Build and Publish Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Verify Plugin
        run: ./gradlew verifyPlugin

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: build/distributions/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          body: |
            ## 📦 Release ${{ github.ref_name }}

            自动构建的插件发布版本。

            ### 📥 安装方式
            1. **推荐**: 从 [JetBrains Marketplace](https://plugins.jetbrains.com/plugin/io.github.pengjran.git-rebase-push-assistant) 安装
            2. **手动**: 下载下方的 `.zip` 文件，在 IDEA 中通过 `Settings → Plugins → ⚙️ → Install Plugin from Disk` 安装

            查看完整变更日志：[CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}