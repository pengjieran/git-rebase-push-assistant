<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <circle cx="20" cy="20" r="18" fill="url(#bgGradient)"/>

  <!-- Git branch icon (bottom left) -->
  <circle cx="12" cy="28" r="2.5" fill="white" opacity="0.9"/>

  <!-- Git branch icon (bottom right) -->
  <circle cx="28" cy="28" r="2.5" fill="white" opacity="0.9"/>

  <!-- Git branch icon (top center - after rebase) -->
  <circle cx="20" cy="14" r="2.5" fill="white"/>

  <!-- Branch lines showing rebase -->
  <path d="M 12 25.5 Q 12 20 20 16.5" stroke="white" stroke-width="2"
        stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 28 25.5 Q 28 20 20 16.5" stroke="white" stroke-width="2"
        stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Push arrow pointing up -->
  <path d="M 20 14 L 20 6" stroke="url(#arrowGradient)" stroke-width="2.5"
        stroke-linecap="round"/>
  <path d="M 16 9 L 20 5 L 24 9" stroke="url(#arrowGradient)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Hot fix spark effect (small accent) -->
  <path d="M 30 10 L 31 8 L 32 10 L 34 9 L 32 11 L 34 12 L 32 11 L 31 13 L 30 11 L 28 12 L 30 10 Z"
        fill="url(#sparkGradient)" opacity="0.85"/>

  <defs>
    <!-- Background gradient: Git blue to Arthas orange -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3C7EBB"/>
      <stop offset="50%" stop-color="#5C6BC0"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <!-- Arrow gradient for emphasis -->
    <linearGradient id="arrowGradient" x1="20" y1="14" x2="20" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE9A8"/>
    </linearGradient>

    <!-- Spark gradient for Arthas hotfix accent -->
    <linearGradient id="sparkGradient" x1="28" y1="8" x2="34" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
</svg>